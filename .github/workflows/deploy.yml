name: Deploy

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy repository contents via scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          source: '.'
          target: ${{ secrets.TARGET }}

      - name: Build app
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            cd ${{ secrets.TARGET }}
            docker build --no-cache -t biletiki_vanilla_calendar_pro . && docker rm -f -v biletiki_vanilla_calendar_pro && docker run -d --name biletiki_vanilla_calendar_pro --restart unless-stopped -p 3401:3401 biletiki_vanilla_calendar_pro
